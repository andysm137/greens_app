<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="greens_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>greens_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    const urlBase64ToUint8Array = (value) => {
      const padded = `${value}${'='.repeat((4 - value.length % 4) % 4)}`;
      const base64 = padded.replace(/-/g, '+').replace(/_/g, '/');
      const bytes = atob(base64);
      return Uint8Array.from(bytes, (character) => character.charCodeAt(0));
    };

    const waitForActivation = async (registration) => {
      if (registration.active) return registration;
      const worker = registration.installing || registration.waiting;
      if (!worker) throw new Error('Push service worker did not start.');
      await new Promise((resolve, reject) => {
        worker.addEventListener('statechange', () => {
          if (worker.state === 'activated') resolve();
          if (worker.state === 'redundant') reject(new Error('Push service worker became redundant.'));
        });
      });
      if (!registration.active) throw new Error('Push service worker did not activate.');
      return registration;
    };

    window.greensPush = {
      isSupported: () =>
        'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
      permission: () => Notification.permission,
      subscribe: async (vapidPublicKey) => {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') throw new Error('Notification permission was not granted.');
        const registration = await navigator.serviceWorker.register(
          'push/push-notifications-sw.js',
          { scope: 'push/' },
        );
        await waitForActivation(registration);
        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
        });
        return JSON.stringify(subscription.toJSON());
      },
      unsubscribe: async () => {
        const registration = await navigator.serviceWorker.getRegistration('push/');
        const subscription = await registration?.pushManager.getSubscription();
        return subscription ? subscription.unsubscribe() : true;
      },
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
